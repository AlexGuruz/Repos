version: 1

runtime:
  mode: audit
  dry_run: false
  log_level: INFO
  timezone: America/Chicago
  # audit = forensic snapshots + row diffs + highlights; no transaction posting.
  # post = legacy posting (requires posting.sheets.apply + KYLO_ALLOW_POST=1).
  watch_interval_secs: 300
  watch_jitter_secs: 15

audit:
  enabled: true
  apply_highlights: true
  write_notes: true
  note_column: G
  late_arrival_min_posted_days: 14
  alerts:
    enabled: true
    anomalies:
      - AMOUNT_REVISION
      - ROW_INSERTED
      - FALSE_PAYROLL
      - FROM_BANK_PAIR
      - INFLATED_PAYROLL_APPEARANCE
      - POSTED_FLAG_TOGGLED
      - KYLO_POSTED_VARIANCE
      - LATE_ARRIVAL
  pair_rules:
    enabled: true
    max_pair_distance_rows: 3
  revision_poll:
    enabled: false
    interval_hours: 6
  highlights:
    enabled: true
    end_column: 7
    inserted_rgb: [1.0, 0.75, 0.75]
    amount_changed_rgb: [1.0, 0.85, 0.55]
    source_changed_rgb: [1.0, 1.0, 0.65]
    date_changed_rgb: [0.85, 0.75, 1.0]
    anomaly_rgb: [1.0, 0.45, 0.45]
    removed_rgb: [0.85, 0.85, 0.85]
    default_rgb: [0.95, 0.90, 0.80]

google:
  # Use .secrets in repo root for fresh rig; set KYLO_SECRETS_DIR env to override
  service_account_json_path: D:\REMODEL\secrets\service_account.json

database:
  global_dsn: postgresql://postgres:kylo@localhost:5433/kylo_global
  per_company: false
  company_dsns: {}

posting:
  sheets:
    apply: false
  mark_posted: false
  note_include_posted_at: true
  flagged_target_highlight:
    enabled: true
    rgb: [1.0, 0.45, 0.45]
  # After a successful target value write, tint cells by intake tab (background only).
  # Disable with posting.source_tab_fill.enabled: false or env KYLO_SOURCE_TAB_FILL=0.
  source_tab_fill:
    enabled: true
    transactions_rgb: [0.78, 0.89, 1.0]
    bank_rgb: [0.85, 0.97, 0.82]
    mixed_rgb: [0.92, 0.92, 0.92]

sheets:
  companies:
    - key: NUGZ
      workbook_url: https://docs.google.com/spreadsheets/d/1MZqpmK6TO7Y9HkMSWPHTIwS3bIZ407sPxSy6R8bZUnE
      tabs:
        intake: "PETTY CASH"
        output: "CLEAN TRANSACTIONS"
    - key: EMPIRE
      workbook_url: https://docs.google.com/spreadsheets/d/1MZqpmK6TO7Y9HkMSWPHTIwS3bIZ407sPxSy6R8bZUnE
      tabs:
        intake: "PETTY CASH"
        output: "CLEAN TRANSACTIONS"
    - key: PUFFIN
      workbook_url: https://docs.google.com/spreadsheets/d/1MZqpmK6TO7Y9HkMSWPHTIwS3bIZ407sPxSy6R8bZUnE
      tabs:
        intake: "PETTY CASH"
        output: "CLEAN TRANSACTIONS"
    - key: JGD
      workbook_url: https://docs.google.com/spreadsheets/d/1MZqpmK6TO7Y9HkMSWPHTIwS3bIZ407sPxSy6R8bZUnE
      tabs:
        intake: "PETTY CASH"
        output: "CLEAN TRANSACTIONS"

# Year-specific workbook URLs for intake and output.
# Each watcher instance (KYLO_2025, KYLO_2026) uses active_years to filter to its year.
year_workbooks:
  "2025":
    intake_workbook_url: https://docs.google.com/spreadsheets/d/1MZqpmK6TO7Y9HkMSWPHTIwS3bIZ407sPxSy6R8bZUnE
    output_workbook_url: https://docs.google.com/spreadsheets/d/1MZqpmK6TO7Y9HkMSWPHTIwS3bIZ407sPxSy6R8bZUnE
  "2026":
    intake_workbook_url: https://docs.google.com/spreadsheets/d/1oNVc-C03ePqLNE76sRUldzpLYsJWb2fo92rkM0_fqNE
    output_workbook_url: https://docs.google.com/spreadsheets/d/1oNVc-C03ePqLNE76sRUldzpLYsJWb2fo92rkM0_fqNE

# Optional: copy downloaded CSV to paths outside C: (e.g. D:, E:) immediately after download.
# Keys are company keys (NUGZ, JGD, EMPIRE, PUFFIN); _default applies when --company is not used.
# Paths are written after each successful download; parent dirs are created if needed.
# intake:
#   csv_copy_paths:
#     NUGZ: ["D:/intake/nugz.csv", "E:/backup/nugz.csv"]
#     JGD: ["E:/data/jgd_intake.csv"]
#     _default: ["D:/intake/petty_cash.csv"]

rules:
  source: jgdtruth
  xlsx_path: null
  promote_on_load: false
  management_workbook_url: null
