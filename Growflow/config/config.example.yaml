# Growflow configuration example
# Copy to config.yaml and fill in values

growflow:
  # API base URL (adjust for GrowFlow production/sandbox)
  base_url: https://api.growflow.app
  # Optional: IANA timezone for "today" in sales scripts (e.g. America/Chicago). Override with GROWFLOW_SALES_TZ.
  # sales_timezone: America/Chicago
  api_key: YOUR_API_KEY
  # If DNS fails (e.g. Cursor sandbox) but you know the API IPv4 from nslookup on VPN:
  # set env GROWFLOW_CONNECT_IP to that address; TLS still uses the hostname from the URL.

# Google Sheets (if syncing to expense sheets)
google:
  # Service account path (or use GOOGLE_APPLICATION_CREDENTIALS)
  service_account_path: config/service_account.json
  # NUGZ EXPENSES spreadsheet (Grow Flow is column 10)
  spreadsheet_id: YOUR_SPREADSHEET_ID

# Sync options
sync:
  # How often to check for updates (minutes)
  interval_minutes: 60

# Daily tax totals sheet (Register 1 close watcher)
taxes_sheet:
  spreadsheet_id: "1GizTKLceyoVVOVAIDrODebYbCK4hRhD5Q9jZ-s0qgIs"
  sheet_name: "Taxes"
  service_account_path: "E:/secrets/gcp/sa.json"

# Balance and Misc tab snapshots (duplicate tab + local JSON; schedule via install script)
balance_misc_snapshot:
  spreadsheet_id: "YOUR_SPREADSHEET_ID"
  sheet_name: "Balance and Misc"
  sheet_id: 0
  service_account_path: "E:/secrets/gcp/stashbox.json"
  snapshot_tab_prefix: "SNAP Balance and Misc"
  timezone: America/Chicago
  max_snapshots: 28
  local_snapshot_dir: data/balance_misc_snapshots
  write_local_json: true
  change_log_dir: logs/balance_misc_changes
  max_change_log_days: 28

register_close_notify:
  register_name: "Register 1"
  # Oklahoma Central (America/Chicago): ~8 PM Sunday, ~10 PM Mon-Sat closes
  min_local_end_hour_sunday: 20
  min_local_end_hour_mon_sat: 22
  notify_once_per_sales_date: true
  poll_interval_seconds: 120
  state_path: data/register_close_taxes_state.json

# COG allocation - sales CSV destination
# Drive folder watched by cog-allocation-system drive_watcher
google_drive:
  sales_csv_folder_id: "1b1XgCjqlcS7UeGeL7oucH92xeuIwxKrP"
  # https://drive.google.com/drive/folders/1b1XgCjqlcS7UeGeL7oucH92xeuIwxKrP
