version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file: ./backend/.env
    volumes:
      - ./backend:/app
      - ${AI_LAB_GOVERNANCE_ROOT:-/tmp/lab-governance}:/governance:ro
    restart: unless-stopped
    network_mode: host   # needed for worker tunnel on 127.0.0.1:8765

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
